name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mesai-takip-app-ky19nn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gruba dal adı dahil: iki dala arka arkaya push edilince, atlanacak olan
# çalışma varsayılan dalın gerçek deploy'unu iptal etmesin. Gerçek yayın
# yalnızca varsayılan daldan yapıldığı için yarış oluşmaz.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pages ortamı yalnızca varsayılan daldan yayına izin veriyor; diğer daldan
    # gelen push'u kırmızı hataya düşürmek yerine sessizce atlıyoruz. Böylece
    # varsayılan dal ileride değişse de workflow kendini düzeltir.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
