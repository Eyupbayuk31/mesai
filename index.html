<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#141109" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)" />
<meta name="description" content="Mesai takip ve maaş hesaplama uygulaması" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mesai" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
<title>Mesai Takip</title>
</head>
<body>
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" aria-label="Menü" hidden>
  <div class="drawer__brand">
    <span class="drawer__mark">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    </span>
    <span class="drawer__wordmark">
      <span class="drawer__name">Mesai Takip</span>
      <span class="drawer__profile" id="drawerProfile">—</span>
    </span>
  </div>
  <nav class="drawer__list" id="drawerList"></nav>
  <div class="drawer__foot" id="drawerFoot"></div>
</aside>

<div id="app" class="app">
  <header class="topbar">
    <button class="topbar__menu" id="topbarMenu" type="button" aria-label="Menü">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="topbar__back" id="topbarBack" type="button" aria-label="Geri" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="topbar__title" id="topbarTitle">Özet</h1>
    <div class="topbar__slot" id="topbarContext" hidden></div>
    <button class="topbar__action" id="topbarAction" type="button" aria-label="Eylem" hidden></button>
  </header>

  <main class="screen" id="screen" role="main"></main>

  <button class="fab" id="fab" type="button" aria-label="Mesai ekle">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    <span class="fab__label">Mesai ekle</span>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="Sekmeler">
    <div class="sidebar-brand" aria-hidden="true">
      <span class="sidebar-brand__mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </span>
      <span class="sidebar-brand__text">
        <span class="sidebar-brand__title">Mesai Takip</span>
        <span class="sidebar-brand__sub">bordro &amp; bütçe</span>
      </span>
    </div>
    <button class="sidebar-profile" id="sidebarProfile" type="button">
      <span class="sidebar-profile__avatar" id="sidebarAvatar">E</span>
      <span class="sidebar-profile__text">
        <span class="sidebar-profile__name" id="sidebarName">Eyüp</span>
        <span class="sidebar-profile__hint">Profili değiştir</span>
      </span>
    </button>
    <div class="tabbar__items" id="tabbarItems"></div>
    <div class="sidebar-foot" aria-hidden="false">
      <button class="sidebar-sync" id="sidebarSync" type="button" hidden>
        <span class="sidebar-sync__dot"></span>
        <span class="sidebar-sync__text" id="sidebarSyncText"></span>
      </button>
      <span class="sidebar-version" id="sidebarVersion"></span>
    </div>
  </nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script>
// Kurtarma ağı: modüller yüklenemezse (yarım güncellenmiş önbellek, kesilen
// indirme) ekran bomboş kalıyordu ve kullanıcının elinde sert yenilemeden
// başka çare yoktu. Bu betik modül DEĞİL — her hâlükârda çalışır.
(function () {
  var BOOT_TIMEOUT = 6000;
  var failed = false;

  window.addEventListener('error', function (e) {
    // Yüklenemeyen <script>/modül: hedefi element olan hata.
    if (e && e.target && e.target !== window && e.target.tagName === 'SCRIPT') failed = true;
  }, true);

  function repair() {
    var done = function () {
      window.location.replace(window.location.pathname + '?yenile=' + Date.now());
    };
    var jobs = [];
    try {
      if ('serviceWorker' in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (err) { /* yine de yenile */ }
    Promise.all(jobs).then(done, done);
  }

  function showRecovery() {
    var el = document.getElementById('screen') || document.getElementById('app') || document.body;
    el.innerHTML = '<div style="max-width:420px;margin:80px auto;padding:24px;text-align:center;font-family:system-ui,sans-serif;">'
      + '<div style="font-size:17px;font-weight:700;margin-bottom:8px;">Uygulama yüklenemedi</div>'
      + '<div style="font-size:14px;line-height:1.5;opacity:0.75;margin-bottom:18px;">Yarım kalmış bir güncelleme olabilir. Kayıtların ve ayarların cihazında duruyor, silinmez.</div>'
      + '<button id="mesaiRepairBtn" style="padding:12px 20px;border:0;border-radius:12px;background:#c9701a;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">Onar ve yeniden yükle</button>'
      + '</div>';
    var btn = document.getElementById('mesaiRepairBtn');
    if (btn) btn.addEventListener('click', repair);
  }

  // Açıldı mı? Bayrağa GÜVENME: eski bir app.js sürümü onu bilmez ama sayfayı
  // gayet güzel çizer. Asıl ölçüt ekranda içerik olup olmadığıdır.
  function booted() {
    if (window.__mesaiBooted) return true;
    var screen = document.getElementById('screen');
    if (!screen) return true;            // profil seçici kabuğun yerine geçmiş
    return screen.children.length > 0;   // ekran çizilmiş
  }

  function check(lastTry) {
    if (booted()) return;
    if (failed) { repair(); return; }    // dosya hiç inmemiş: doğrudan onar
    if (lastTry) showRecovery();         // hâlâ boş: kullanıcıya sor
  }

  // Yavaş bağlantıya bir şans daha: 6. saniyede bak, boşsa 11. saniyede karar ver.
  setTimeout(function () { check(false); }, BOOT_TIMEOUT);
  setTimeout(function () { check(true); }, BOOT_TIMEOUT + 5000);
})();
</script>
</body>
</html>
