<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#141109" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)" />
<meta name="description" content="Mesai takip ve maaş hesaplama uygulaması" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mesai" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
<title>Mesai Takip</title>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button class="topbar__back" id="topbarBack" type="button" aria-label="Geri" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="topbar__title" id="topbarTitle">Özet</h1>
    <button class="topbar__action" id="topbarAction" type="button" aria-label="Eylem" hidden></button>
  </header>

  <main class="screen" id="screen" role="main"></main>

  <button class="fab" id="fab" type="button" aria-label="Mesai ekle">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="Sekmeler">
    <button class="tabbar__item" data-tab="home" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 11.5 12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Özet</span>
    </button>
    <button class="tabbar__item" data-tab="entries" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6h12M8 12h12M8 18h12"/>
        <circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
      <span>Kayıtlar</span>
    </button>
    <button class="tabbar__item" data-tab="report" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="4" width="16" height="17" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 13v4M12 10v7M16 15v2" stroke-linecap="round"/>
      </svg>
      <span>Rapor</span>
    </button>
    <button class="tabbar__item" data-tab="budget" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="18" height="13" rx="2.5"/>
        <path d="M3 10h18M7.5 15h3"/>
      </svg>
      <span>Bütçe</span>
    </button>
    <button class="tabbar__item" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a8 8 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a8 8 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a8 8 0 0 0 1.7 1l.4 2.9h4l.4-2.9a8 8 0 0 0 1.7-1l2.5 1 2-3.5z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Ayarlar</span>
    </button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
